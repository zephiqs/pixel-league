<html lang="en">

<title>Pixel League</title>
<style>

<script>
'use strict';
/* =========================================================
   PIXEL LEAGUE — pixel basketball, v0.1
   world: 480x270 px, 6 px = 1 ft, hoop 10 ft (60 px)
   ========================================================= */
const W = 480, H = 270, GROUND = 240, RIMY = 180, HX = 433, RF = 424, RB = 442, BOARD = 444, FT = 6;
const GRAV = 700, BR = 4, WALK = 72, SPRINT = 128, JUMP_V = 212;
const METER = { fill: 0.75, center: 0.95, zh: 0.05, perfect: 0.022 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const rnd = () => Math.random(), gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += rnd(); return (u - 3) * 0.8165 * 1.414; };
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

/* ---------- palette ---------- */
const C = {
  ink: '#0b0f24', wallA: '#26418c', wallB: '#2f4fa6', wallC: '#1c3270', beam: '#151a33', beamL: '#2a3158', win: '#7fc8ff', winD: '#4b8fd6',
  woodA: '#c98a4b', woodB: '#bb7d3f', woodC: '#d49656', woodD: '#a46a33', line: '#f4efe0', paint: '#2b5bd7', paintD: '#234bb3',
  skin: '#d99a62', skinD: '#b97a46', hair: '#2a160c', band: '#e8344a', jersey: '#2f6bff', jerseyD: '#2354cc', trim: '#ffffff', shorts: '#1b2c78', shoe: '#f5f5f5', sole: '#e8344a',
  ball: '#e9772b', ballD: '#b9561a', ballL: '#ffa056', gold: '#ffd23f', green: '#34f08a', red: '#ff5a5a'
};

/* ---------- bitmap font 3x5 ---------- */
const FONT = {};
('A:010101111101101 B:110101110101110 C:011100100100011 D:110101101101110 E:111100110100111 F:111100110100100 G:011100101101011 H:101101111101101 I:111010010010111 J:001001001101010 K:101101110101101 L:100100100100111 M:101111111101101 N:111101101101101 O:010101101101010 P:110101110100100 Q:010101101111011 R:110101110101101 S:011100010001110 T:111010010010010 U:101101101101111 V:101101101101010 W:101101111111101 X:101101010101101 Y:101101010010010 Z:111001010100111 ' +
 '0:111101101101111 1:010110010010111 2:110001010100111 3:110001010001110 4:101101111001001 5:111100110001110 6:011100111101111 7:111001010010010 8:111101111101111 9:111101111001110 -:000000111000000 !:010010010000010 %:101001010100101 /:001001010100100 ::000010000010000 .:000000000000010 +:000010111010000 ?:110001010000010 \':010010000000000 >:100010001010100 =:000111000111000 <:001010100010001').split(' ').forEach(s => { FONT[s[0]] = s.slice(2); });
function glyphs(g, str, x, y, col, sc, sh) {
  str = String(str).toUpperCase(); const so = Math.max(1, Math.round(sc / 3));
  for (let pass = sh ? 0 : 1; pass < 2; pass++) {
    let cx = Math.round(x);
    for (const ch of str) {
      const gl = FONT[ch];
      if (gl) for (let i = 0; i < 15; i++) if (gl[i] === '1') {
        const px = cx + (i % 3) * sc + (pass === 0 ? so : 0), py = Math.round(y) + Math.floor(i / 3) * sc + (pass === 0 ? so : 0);

}
function text(s, x, y, col, sc, sh) { glyphs(ctx, s, x, y, col, sc || 1, sh); }
const tw = (s, sc) => String(s).length * 4 * (sc || 1) - (sc || 1);
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function line(x0, y0, x1, y1, c, w) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); w = w || 1; ctx.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (let n = 0; n < 600; n++) { ctx.fillRect(x0, y0, w, w); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}

/* ---------- gym background (drawn once) ---------- */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
function buildGym() {
  const g = bg.getContext('2d'), prev = ctx; // draw with the same helpers by swapping the context
  window.__ctx = g; paintGym(g);
}
function paintGym(g) {
  const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  let seed = 7; const rr = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // wall
  r(0, 0, W, 196, C.wallA);
  for (let y = 52; y < 196; y += 12) r(0, y, W, 1, C.wallC);                  // painted block lines
  for (let x = 0; x < W; x += 40) r(x, 52, 1, 144, C.wallC);
  r(0, 52, W, 3, C.wallC); r(0, 180, W, 16, C.wallB);                         // wainscot
  for (let x = 0; x < W; x += 16) r(x + 3, 183, 10, 2, C.wallA);
  // ceiling + trusses
  r(0, 0, W, 14, C.beam); r(0, 14, W, 2, C.beamL);
  for (let x = 0; x < W; x += 24) { for (let i = 0; i < 12; i++) { r(x + i, 2 + i, 2, 1, C.beamL); r(x + 24 - i, 2 + i, 2, 1, C.beamL); } }
  // clerestory windows
  r(0, 22, W, 30, '#0d1430');
  for (let x = 6; x < W; x += 30) { r(x, 25, 26, 24, C.winD); r(x + 1, 26, 24, 22, C.win); r(x + 1, 26, 24, 5, '#b9e2ff'); r(x + 12, 26, 2, 22, C.winD); r(x + 1, 37, 24, 2, C.winD); }
  // championship banners
  const bc = ['#e8344a', '#ffd23f', '#34c0f0', '#9b59e6', '#34f08a'];
  [20, 56, 92, 366, 402, 438].forEach((x, i) => { r(x, 56, 22, 34, bc[i % 5]); r(x, 56, 22, 3, '#0b0f24'); r(x + 3, 62, 16, 2, '#fff'); r(x + 3, 68, 16, 8, 'rgba(0,0,0,.25)'); for (let k = 0; k < 3; k++) r(x + 4 + k * 5, 70, 3, 3, '#fff'); r(x + 8, 90, 6, 4, bc[i % 5]); r(x + 9, 94, 4, 3, bc[i % 5]); });
  // bleachers + crowd
  const tiers = [[132, '#5a3a1c', '#7c522a'], [146, '#4a2f16', '#68431f'], [160, '#3c2610', '#563619']];
  tiers.forEach(([y, a, b], t) => {
    r(0, y + 8, W, 6, a); r(0, y + 8, W, 1, b);
    for (let x = 0; x < W; x += 5) {
      if (rr() < 0.5) { const sk = ['#e0ac7c', '#c68642', '#8d5524', '#f1c27d'][Math.floor(rr() * 4)], sh = ['#e8344a', '#ffd23f', '#34c0f0', '#fff', '#9b59e6', '#34f08a', '#2f6bff'][Math.floor(rr() * 7)];
        r(x + 1, y + 1, 3, 3, sk); r(x, y + 4, 5, 5, sh); r(x + 1, y, 3, 1, rr() < 0.5 ? '#2a160c' : '#4a3020'); }
    }
  });
  r(0, 174, W, 2, '#2a2f55'); for (let x = 0; x < W; x += 12) r(x, 168, 2, 8, '#2a2f55'); r(0, 168, W, 2, '#3b4170');
  // lettering
  const tx = 'PIXEL LEAGUE';
  g.save(); const old = window.__target; 
  // draw text with the shared font on this context
  const c0 = ctx; textOn(g, tx, 144, 100, '#ffd23f', 4, '#0b0f24');
  // hanging lights + glow
  for (let x = 40; x < W; x += 80) { r(x - 1, 14, 2, 8, '#444a70'); r(x - 10, 22, 20, 5, '#2a2f55'); r(x - 8, 26, 16, 3, '#fff6c8'); }
  g.restore();
  // floor
  r(0, 196, W, 74, C.woodA);
  for (let y = 196, i = 0; y < H; y += 6, i++) {
    r(0, y, W, 1, i % 2 ? C.woodD : C.woodB); r(0, y + 1, W, 2, i % 3 === 0 ? C.woodC : C.woodA);
    for (let x = ((i * 53) % 70); x < W; x += 70) r(x, y + 1, 1, 5, C.woodD);
  }
  r(0, 196, W, 2, '#6b3f1c'); r(0, 198, W, 1, '#8a5428');
  // painted court
  const l = (x, y, w, h) => r(x, y, w, h, C.line);
  r(343, 222, 114, 38, C.paint); r(343, 222, 114, 3, C.paintD); r(343, 257, 114, 3, C.paintD);
  l(343, 222, 114, 2); l(343, 258, 114, 2); l(343, 222, 2, 38); l(455, 206, 3, 62);          // key + baseline
  l(0, 206, 458, 2); l(0, 266, 458, 2);                                                          // sidelines
  ell(g, 343, 241, 22, 16, C.line, true);                                                      // free-throw circle
  ell(g, HX, 237, 142, 31, C.line, true);                                                      // three-point arc
  l(HX, 206, 25, 2); l(HX, 266, 25, 2);
  l(175, 206, 2, 62); ell(g, 176, 237, 26, 14, C.line, false);                                    // half court + circle
  textOn(g, 'PL', 164, 231, C.gold, 3, '#0b0f24');
  r(446, 240, 2, 2, C.line); r(428, 232, 10, 10, 'rgba(255,255,255,.0)');
}
function ell(g, cx, cy, rx, ry, col, leftOnly) {
  g.fillStyle = col;
  for (let a = 0; a < 6.2832; a += 0.012) { const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry; if (leftOnly && x > cx + 0.5) continue; g.fillRect(Math.round(x), Math.round(y), 2, 2); }
}
function textOn(g, s, x, y, col, sc, sh) { glyphs(g, s, x, y, col, sc, sh); }

/* ---------- audio (tiny synth) ---------- */
let AC = null;
function audioInit() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(f, d, type, v, slide) {
  if (!AC) return; try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    g.gain.setValueAtTime(v || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
function noise(d, v, hp) {
  if (!AC) return; try {
    const n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), a = buf.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1500; g.gain.value = v || 0.1; s.buffer = buf; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  } catch (e) {}
}
const SND = {
  bounce: v => tone(95 + 30 * (v || 0.5), 0.09, 'sine', 0.18 * (v || 0.5) + 0.04, 0.5),
  swish: () => { noise(0.28, 0.1, 3500); tone(880, 0.1, 'triangle', 0.05); },
  rim: () => { tone(420, 0.16, 'triangle', 0.12, 0.7); noise(0.06, 0.05, 2500); },
  board: () => tone(210, 0.14, 'square', 0.07, 0.6),
  green: () => { tone(660, 0.09, 'square', 0.06); setTimeout(() => tone(880, 0.09, 'square', 0.06), 70); setTimeout(() => tone(1320, 0.16, 'square', 0.06), 140); },
  jump: () => tone(300, 0.12, 'square', 0.04, 1.8),
  dunk: () => { tone(90, 0.3, 'sawtooth', 0.16, 0.4); noise(0.25, 0.14, 400); },
  move: () => tone(520, 0.05, 'square', 0.03, 1.4),
  pickup: () => tone(440, 0.06, 'square', 0.04)
};

/* ---------- shot model: distance + timing + randomness ---------- */
const ft = px => Math.abs(HX - px) / FT;
function greenChance(d) { if (d <= 5) return 1; if (d <= 22) return lerp(1, 0.95, (d - 5) / 17); if (d <= 30) return lerp(0.95, 0.3, (d - 22) / 8); if (d <= 40) return lerp(0.3, 0.05, (d - 30) / 10); return 0.05; }
function shotChance(d, e) {
  const peak = greenChance(d), close = clamp(1 - (d - 4) / 16, 0, 1), floor = 0.22 + 0.38 * close, ae = Math.abs(e), green = ae <= METER.zh;
  const m = green ? 1 : Math.exp(-Math.pow((ae - METER.zh) / 0.09, 2));
  return clamp(peak * (floor + (1 - floor) * m), 0.02, 1);
}
function planShot(d, e) {
  const p = shotChance(d, e), make = rnd() < p; let depth;
  if (make) { const tight = Math.abs(e) <= METER.zh ? 0.3 : 1; depth = Math.min(2.6, Math.abs(gauss()) * 1.1) * tight * (rnd() < 0.5 ? -1 : 1); }
  else {
    const ae = Math.abs(e), mag = 10 + rnd() * 9 + clamp(d / 40, 0, 1) * 6 + clamp(ae * 2, 0, 0.8) * rnd() * 6;

  }

/* ---------- state ---------- */
const P = { x: 200, h: 0, vh: 0, vx: 0, face: 1, ground: true, anim: 0, speed: 0, shot: null, dunk: null, move: null, moveCd: 0, chain: 0, land: 0, bob: 0 };
const B = { x: 210, y: 220, vx: 0, vy: 0, mode: 'held', dribT: 0.5, age: 0, scored: false, resolved: true, info: null, rest: 0, prevY: 220, rimHit: false };
const S = { state: 'loading', t: 0, score: 0, streak: 0, made: 0, att: 0, shake: 0, rimShake: 0, netSway: 0, netT: 0, last: '', best: 0, hint: '' };
const IN = { left: false, right: false, sprint: false, ax: 0, shootHeld: false };
const FX = [];
function pop(txt, col, x, y) { FX.push({ txt, col, x: x == null ? P.x : x, y: y == null ? GROUND - P.h - 56 : y, t: 0 }); }

function resetGame() {
  Object.assign(P, { x: 200, h: 0, vh: 0, vx: 0, face: 1, ground: true, shot: null, dunk: null, move: null, moveCd: 0, chain: 0, land: 0 });
  Object.assign(B, { mode: 'held', dribT: 0.5, scored: false, resolved: true, info: null, vx: 0, vy: 0, rest: 0 });
  S.score = 0; S.streak = 0; S.made = 0; S.att = 0; FX.length = 0;
}

/* ---------- actions ---------- */
function onShootDown() {
  if (S.state !== 'play') return;
  IN.shootHeld = true;
  if (B.mode !== 'held' || P.shot || P.dunk) return;
  if (!P.ground) {                                           // airborne: dunk near the rim, otherwise a quick fadeaway
    if (Math.abs(HX - P.x) < 80) return startDunk();
    P.shot = { phase: 'jump', m: 0, released: true, launched: false, e: gauss() * 0.14 + 0.02, quick: true }; planFor(P.shot); return;
  }
  P.move = null; P.face = HX >= P.x ? 1 : -1;
  P.shot = { phase: 'gather', m: 0, released: false, launched: false, plan: null };
}
function onShootUp() {
  IN.shootHeld = false;
  if (P.shot && P.shot.phase === 'gather') releaseShot();
}
function planFor(s) { s.dist = ft(P.x); s.pts = s.dist >= 22 ? 3 : 2; s.plan = planShot(s.dist, s.e); s.green = Math.abs(s.e) <= METER.zh; }
function releaseShot() {
  const s = P.shot; if (!s || s.released) return;
  s.released = true; s.e = s.m - METER.center; planFor(s); s.phase = 'jump';
  P.ground = false; P.vh = JUMP_V; SND.jump();
  const ae = Math.abs(s.e);
  if (ae <= METER.perfect) { pop('PERFECT', C.green); SND.green(); } else if (ae <= METER.zh) { pop('GREEN', C.green); SND.green(); }

}
function launchBall() {
  const s = P.shot; s.launched = true;
  const fy = GROUND - P.h, dir = (HX - P.x) >= 0 ? 1 : -1;
  B.x = P.x + P.face * 6; B.y = fy - 44; B.prevY = B.y;
  const tx = HX + dir * s.plan.depth, dx = Math.abs(tx - B.x), T = 0.56 + 0.0016 * dx;
  B.vx = (tx - B.x) / T; B.vy = (RIMY - B.y - 0.5 * GRAV * T * T) / T;

}
function startDunk() {
  if (B.mode !== 'held' || P.dunk || P.shot) return;

  P.face = HX >= P.x ? 1 : -1; P.move = null;
  P.dunk = { t: 0, T: 0.66, x0: P.x, h0: P.h, done: false };
  P.ground = false; SND.jump();

function startMove(type) {

const MOVES = { CROSS: { dur: 0.34, label: 'CROSSOVER' }, STEP: { dur: 0.36, label: 'STEP-BACK' }, BTB: { dur: 0.36, label: 'BEHIND BACK' } };
